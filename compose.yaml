services:
  fatigue-monitor:
    build:
      context: .
      args:
        REQUIREMENTS: server/requirements.txt
    ports:
      - "5001:5001"
    environment:
      FATIGUE_DEVICE: cpu
      HOST: 0.0.0.0
    volumes:
      - fatigue-data:/data
    restart: unless-stopped

volumes:
  fatigue-data:
