<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}驾驶员疲劳监测系统{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="/" aria-label="驾驶员疲劳监测系统首页">
        <span class="brand-mark">FD</span>
        <span><strong>疲劳监测</strong><small>YOLO11 + PFLD</small></span>
      </a>
      <nav aria-label="主导航">
        <a href="/" class="{{ 'active' if page == 'dashboard' else '' }}">运行总览</a>
        <a href="/detect" class="{{ 'active' if page == 'detect' else '' }}">检测中心</a>
        <a href="/history" class="{{ 'active' if page == 'history' else '' }}">历史记录</a>
      </nav>
      <div class="runtime" data-device="{{ detector.device }}">
        <span class="status-dot"></span>
        <span><small>推理设备</small><strong>{{ detector.device|upper }}</strong></span>
      </div>
    </aside>
    <main>
      <header class="topbar">
        <div><p class="eyebrow">驾驶安全工作台</p><h1>{% block heading %}{% endblock %}</h1></div>
        <div class="service-state"><span class="status-dot"></span>服务正常</div>
      </header>
      <div class="page-content">{% block content %}{% endblock %}</div>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
