<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>{% block title %}驾驶员疲劳监测系统{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body data-page="{{ page }}">
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="/" aria-label="驾驶员疲劳监测系统首页">
        <span class="brand-mark"><i data-lucide="scan-face" aria-hidden="true"></i></span>
        <span><strong>疲劳监测</strong><small>驾驶安全工作台</small></span>
      </a>
      <nav aria-label="主导航">
        <a href="/" class="{{ 'active' if page == 'dashboard' else '' }}"><i data-lucide="layout-dashboard" aria-hidden="true"></i><span>运行总览</span></a>
        <a href="/detect" class="{{ 'active' if page == 'detect' else '' }}"><i data-lucide="scan-line" aria-hidden="true"></i><span>检测中心</span></a>
        <a href="/analytics" class="{{ 'active' if page == 'analytics' else '' }}"><i data-lucide="chart-no-axes-combined" aria-hidden="true"></i><span>分析中心</span></a>
        <a href="/history" class="{{ 'active' if page == 'history' else '' }}"><i data-lucide="history" aria-hidden="true"></i><span>历史记录</span></a>
      </nav>
      <div class="runtime" data-device="{{ detector.device }}">
        <span class="status-dot"></span>
        <span><small>计算设备</small><strong>{{ detector.device|upper }}</strong></span>
      </div>
    </aside>
    <main>
      <header class="topbar">
        <div><p class="eyebrow">驾驶安全监测</p><h1>{% block heading %}{% endblock %}</h1></div>
        <div class="service-state"><span class="status-dot"></span><span>系统运行正常</span></div>
      </header>
      <div class="page-content">{% block content %}{% endblock %}</div>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="{{ url_for('static', filename='vendor/lucide.min.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
